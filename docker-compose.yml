services:
  ros2_humble_dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: ros2_humble_dev
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - .:/root/ros2_ws:cached
      # Uncomment below later when enabling GUI tools (RViz / Gazebo):
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - ROS_DISTRO=humble
      # - DISPLAY=${DISPLAY}
